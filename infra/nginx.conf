# K-one v2 — nginx config for the web container.
# Serves the built React SPA and proxies API requests to the api service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy — matches the legacy base path the frontend uses by default
    # (VITE_API_BASE=/k-one/api). The SPA calls ${BASE}/index.php?module=…
    # so we rewrite the proxied path to the gateway's /index.php route.
    location ^~ /k-one/api {
        rewrite ^/k-one/api/index\.php$ /index.php break;
        rewrite ^/k-one/api/?$ /index.php break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # multipart uploads (import module)
        client_max_body_size 512m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Direct API base fallback (if frontend uses VITE_API_BASE=/api)
    location ^~ /api {
        rewrite ^/api/index\.php$ /index.php break;
        rewrite ^/api/?$ /index.php break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 512m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
